name: Update market data

on:
  schedule:
    - cron: "0 9 * * *"
      timezone: "America/New_York"
  workflow_dispatch:
    inputs:
      backfill_start:
        description: "Optional first session date to backfill, YYYY-MM-DD"
        required: false
        type: string
      backfill_end:
        description: "Optional last session date to backfill, YYYY-MM-DD"
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update daily market data
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.backfill_start == '' || inputs.backfill_end == '' }}
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python scripts/update_daily.py

      - name: Backfill session data
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.backfill_start != '' && inputs.backfill_end != '' }}
        env:
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python scripts/backfill_sessions.py --start "${{ inputs.backfill_start }}" --end "${{ inputs.backfill_end }}"

      - name: Run automated tests
        run: python -m unittest discover -s tests

      - name: Commit updated data
        shell: bash
        run: |
          if git diff --quiet -- data docs/data; then
            echo "No market data changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data
          git commit -m "Automated market data update: $(TZ=America/New_York date +%F)"
          git push
