<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Range Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">Session chart: 08:00 to next-day 07:59 America/New_York</p>
        <h1>Market Range Tracker</h1>
      </div>
      <div class="latest">
        <span>Latest Update</span>
        <strong id="latestUpdate">No data yet</strong>
      </div>
    </header>

    <section class="toolbar" aria-label="Filters">
      <label>Symbol<select id="symbolFilter"></select></label>
      <div class="date-nav" aria-label="Session date navigation">
        <button class="icon-button" id="prevDate" type="button" title="Previous day" aria-label="Previous day">‹</button>
        <label>Session Date<input id="sessionDate" type="date"></label>
        <button class="icon-button" id="nextDate" type="button" title="Next day" aria-label="Next day">›</button>
      </div>
    </section>

    <section class="analytics">
      <div class="chart-panel">
        <div class="section-head">
          <div>
            <h2>Day Trend</h2>
            <span id="trendMeta">Select one symbol and one session date</span>
          </div>
        </div>
        <div class="range-legend" id="rangeLegend"></div>
        <div class="trend-scroll">
          <canvas id="trendChart" width="1800" height="420" aria-label="Intraday price trend chart"></canvas>
        </div>
      </div>
    </section>

    <section class="table-panel">
      <div class="section-head">
        <h2>History</h2>
        <div class="table-tools">
          <span id="rowCount">0 rows</span>
          <input id="tableSearch" placeholder="Search table...">
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th><th>Symbol</th><th>High</th><th>Low</th><th>Range</th>
              <th>Range %</th><th>High Time</th><th>Low Time</th><th>Status</th><th>Bars</th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
