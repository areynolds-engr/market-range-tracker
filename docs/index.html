<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Market Range Tracker</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">08:00-08:30 America/New_York</p>
        <h1>Market Range Tracker</h1>
      </div>
      <div class="latest">
        <span>Latest Update</span>
        <strong id="latestUpdate">No data yet</strong>
      </div>
    </header>

    <section class="summary-grid" id="summaryGrid" aria-label="Latest instrument ranges"></section>

    <section class="toolbar" aria-label="Filters">
      <label>Symbol<select id="symbolFilter"></select></label>
      <label>Date<input id="dateFilter" type="date"></label>
      <label>Start<input id="startDateFilter" type="date"></label>
      <label>End<input id="endDateFilter" type="date"></label>
      <div class="periods" id="periodButtons" aria-label="Quick periods"></div>
    </section>

    <section class="analytics">
      <div class="chart-panel">
        <div class="section-head">
          <h2>Historical Range</h2>
          <span id="rowCount">0 rows</span>
        </div>
        <canvas id="rangeChart" aria-label="Historical range chart"></canvas>
      </div>
      <aside class="question-panel">
        <h2>Ask the data</h2>
        <form id="questionForm">
          <input id="questionInput" autocomplete="off" placeholder="Try: Which symbol has the largest average range?">
          <button>Ask</button>
        </form>
        <div class="answer" id="answerBox" aria-live="polite"></div>
      </aside>
    </section>

    <section class="table-panel">
      <div class="section-head">
        <h2>History</h2>
        <input id="tableSearch" placeholder="Search table...">
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Date</th><th>Symbol</th><th>High</th><th>Low</th><th>Range</th>
              <th>Range %</th><th>High Time</th><th>Low Time</th><th>Status</th><th>Bars</th>
            </tr>
          </thead>
          <tbody id="historyBody"></tbody>
        </table>
      </div>
    </section>
  </main>
</body>
</html>
